<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Content Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5fc;color:#26243c;font:16px system-ui,sans-serif}header{background:white;padding:16px 5%;border-bottom:1px solid #e7e4f3;display:flex;justify-content:space-between;align-items:center;gap:10px}header b{font-size:clamp(18px,4vw,22px);color:#604bd1}header span{font-size:12px;background:#efecff;color:#604bd1;padding:8px;border-radius:20px}main{max-width:1000px;margin:24px auto;padding:0 18px}h1{font-size:clamp(28px,5vw,42px);margin-bottom:8px}p{color:#6d6980}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);gap:20px;margin-top:24px;min-width:0}.panel{background:#fff;border:1px solid #e9e6f3;border-radius:18px;padding:22px;min-width:0;box-shadow:0 6px 20px #33226a08}nav{display:flex;flex-direction:column;gap:8px;align-self:start;min-width:0}button{cursor:pointer;border:0;border-radius:10px;padding:12px 15px;font-weight:700}nav button{text-align:left;background:white;color:#55516b;min-width:0}nav button.active{background:#efecff;color:#604bd1}label{display:block;margin:18px 0 8px;font-size:13px;font-weight:700}textarea,select{width:100%;font:inherit;border:1px solid #dcd9eb;border-radius:10px;padding:12px}textarea{min-height:110px}button.primary{background:#6655d9;color:white}button.secondary{background:#eeeaff;color:#5947c4}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.output{white-space:pre-wrap;background:#f8f7ff;border:1px solid #e8e3ff;border-radius:12px;min-height:85px;padding:18px;margin-top:20px;line-height:1.6}.small{font-size:13px;color:#77738d}.saved{padding:15px 0;border-bottom:1px solid #eee}.saved pre{white-space:pre-wrap;font:inherit}.note{margin-top:20px;padding:12px;border-radius:10px;background:#f1f5ff;font-size:13px}@media(max-width:680px){header span{font-size:11px;padding:7px}main{margin:20px auto;padding:0 14px}h1{font-size:30px}.layout{display:flex;flex-direction:column;gap:14px;margin-top:20px}.panel{padding:18px;border-radius:16px}nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px;width:100%;overflow:visible}nav button{white-space:normal;text-align:center;font-size:13px;padding:12px 6px;min-height:46px}nav button:last-child{grid-column:1/-1}textarea{min-height:100px}label{margin:14px 0 6px}.actions button{flex:1}}
</style></head><body><header><b>✦ AI Content Studio</b><span>Free creator toolkit</span></header><main><h1>Create better content, faster.</h1><p>Make captions, product descriptions, hashtags, and marketing emails. Save drafts on your device.</p><div class="layout"><nav class="panel" id="nav"><button data-tab="captions">✍️ Captions</button><button data-tab="products">🛍️ Products</button><button data-tab="hashtags"># Hashtags</button><button data-tab="emails">✉️ Emails</button><button data-tab="saved">🔖 Saved</button></nav><section class="panel" id="content"></section></div><p class="small">Starter edition: template-based generation, not a connected AI model. Saved drafts remain in this browser.</p></main><script>
const $=id=>document.getElementById(id),titles={captions:'Social media captions',products:'Product descriptions',hashtags:'Hashtag suggestions',emails:'Marketing emails'};let tab='captions',draft='';const clean=s=>s.trim().replace(/\s+/g,' ').slice(0,500);const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function saved(){try{return JSON.parse(localStorage.getItem('acs_drafts')||'[]')}catch{return []}}function notify(s){$('status').textContent=s}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='saved'){const entries=saved();$('content').innerHTML='<h2>Saved drafts</h2><p class="small">Stored only in this browser.</p><div id="status"></div>'+(entries.length?entries.map((e,i)=>'<div class="saved"><strong>'+escape(e.type)+'</strong><pre>'+escape(e.text)+'</pre><button class="secondary" data-copy="'+i+'">Copy</button> <button class="secondary" data-del="'+i+'">Delete</button></div>').join(''):'<p>No drafts saved yet.</p>');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let a=saved();a.splice(Number(b.dataset.del),1);localStorage.setItem('acs_drafts',JSON.stringify(a));render()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(saved()[Number(b.dataset.copy)].text).then(()=>notify('Copied!')).catch(()=>notify('Copy not available')));return}
$('content').innerHTML='<h2>'+titles[tab]+'</h2><p class="small">Create an editable first draft.</p><label for="topic">Describe your topic</label><textarea id="topic" maxlength="500" placeholder="Describe your product, post, or offer"></textarea><label for="platform">Platform</label><select id="platform"><option>Instagram</option><option>Facebook</option><option>LinkedIn</option><option>Website</option></select><label for="tone">Tone</label><select id="tone"><option>Friendly</option><option>Professional</option><option>Playful</option><option>Bold</option></select><div class="actions"><button class="primary" id="generate">Generate draft</button></div><div class="output" id="output">Your draft will appear here.</div><div class="actions"><button class="secondary" id="copy" disabled>Copy</button><button class="secondary" id="save" disabled>Save draft</button></div><div id="status" class="note">No API fees. Real AI generation can be added later.</div>';
$('generate').onclick=generate;$('copy').onclick=()=>navigator.clipboard.writeText(draft).then(()=>notify('Copied!')).catch(()=>notify('Copy not available'));$('save').onclick=()=>{let a=saved();a.unshift({type:titles[tab],text:draft});try{localStorage.setItem('acs_drafts',JSON.stringify(a.slice(0,100)));notify('Saved on this device!')}catch{notify('Storage unavailable; please copy your draft.')}}}
function generate(){let topic=clean($('topic').value);if(!topic){notify('Please enter a topic.');return}let tone=$('tone').value,platform=$('platform').value,lead={Friendly:'We are excited to share',Professional:'Introducing',Playful:'Guess what? Check out',Bold:'Discover something new:'}[tone];if(tab==='captions')draft=lead+' '+topic+'! ✨\n\nTake a closer look and tell us what you think.\n\n#NewPost #DiscoverMore #Creator';if(tab==='products')draft=topic+'\n\nExplore '+topic.toLowerCase()+'. Learn more about the features and decide if it fits your needs.\n\nKey details:\n• [Add verified product feature]\n• [Add verified specifications]\n• [Add price and availability]\n\nShop or learn more: [insert link]';if(tab==='hashtags'){let tags=[...new Set((topic.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(x=>x.length>2).slice(0,8))].map(x=>'#'+x);draft=[...tags,'#ContentCreator','#CreativeIdeas','#SmallBusiness','#Community'].join(' ')}if(tab==='emails')draft='Subject: '+topic+'\n\nHi there,\n\n'+lead+' '+topic+'.\n\nWe would love to tell you more. [Add verified benefits and details here.]\n\n[Insert your call to action and link]\n\nBest,\n[Your brand]\n\n[Include unsubscribe information where required]';$('output').textContent=draft;$('copy').disabled=false;$('save').disabled=false;notify('Draft ready for editing. Platform: '+platform)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draft='';render()});render();
</script></body></html>
