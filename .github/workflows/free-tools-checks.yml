name: Free tools and security checks
on:
  push:
    paths:
      - 'index.html'
      - 'api/**'
      - 'tests/**'
      - '.github/workflows/free-tools-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'api/**'
      - 'tests/**'
      - '.github/workflows/free-tools-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run no-cost regression tests
        run: node --test tests/security.test.mjs
